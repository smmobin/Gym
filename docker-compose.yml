# Optional VPS path: API + Postgres.
# Frontend: build separately (npm run build) and serve via nginx / CDN / static host.
# Never commit real .env — copy backend/.env.example and set secrets locally.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: gym_control
    volumes:
      - gym_pg_data:/var/lib/postgresql/data
    ports:
      # expose only if you need host tools (pg_dump from laptop); prefer internal net in prod
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: GYM CONTROL API
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://gym:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/gym_control
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_SET_A_REAL_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      ALLOW_DESTRUCTIVE_SEED: "false"
    ports:
      - "8000:8000"

volumes:
  gym_pg_data:
