# Optional VPS path: API + Postgres.
# Frontend: build separately (npm run build) and serve via nginx / CDN / static host.
# Never commit real .env — copy backend/.env.example and set secrets locally.
# Required before `docker compose up`: export POSTGRES_PASSWORD, SECRET_KEY, CORS_ORIGINS.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random value}
      POSTGRES_DB: gym_control
    volumes:
      - gym_pg_data:/var/lib/postgresql/data
    # Docker publishes ports past ufw/iptables rules: keep Postgres on loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: GYM CONTROL API
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://gym:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gym_control
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your https frontend origin}
      ALLOW_DESTRUCTIVE_SEED: "false"
      # Host nginx reaches the container through the Docker bridge; the port below is
      # loopback-only, so only local processes can set X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    # nginx on the host terminates TLS and proxies to this loopback port.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  gym_pg_data:
