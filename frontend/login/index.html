<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){try{var t=localStorage.getItem('gym-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute('data-theme','dark');document.documentElement.style.colorScheme='dark';}})();</script>
  <title>ورود به سامانه — GYM CONTROL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body class="panel-page">
  <div class="api-banner" data-api-banner hidden></div>
  <div class="login-shell">
    <div class="login-theme-bar" data-theme-mount></div>
    <div class="login-card">
      <header class="login-card-head">
        <p class="eyebrow en">GYM CONTROL</p>
        <h1 id="login-heading">ورود به سامانه</h1>
        <p class="lead" data-login-lead>شماره موبایل خود را وارد کنید.</p>
      </header>

      <div class="login-wizard" data-login-wizard aria-labelledby="login-heading">
        <!-- Step 1: mobile only -->
        <section class="login-step is-active" data-step="mobile">
          <form class="form-grid login-form" data-mobile-form>
            <label class="login-mobile-field">
              <span class="login-field-label">موبایل</span>
              <input
                name="mobile"
                type="tel"
                inputmode="numeric"
                autocomplete="username"
                placeholder="09xxxxxxxxx"
                maxlength="11"
                minlength="11"
                pattern="09[0-9]{9}"
                title="موبایل ۱۱ رقمی با ۰۹"
                dir="ltr"
                required
              />
            </label>
            <button class="btn wide login-primary-btn" type="submit">ادامه</button>
          </form>
        </section>

        <!-- Step 2: role chooser (only when multiple identities) -->
        <section class="login-step" data-step="chooser" hidden aria-labelledby="login-chooser-title">
          <h2 id="login-chooser-title" class="login-step-title">با کدام نقش وارد می‌شوید؟</h2>
          <p class="hint" data-chooser-mobile></p>
          <div class="login-role-list" data-role-list role="list"></div>
          <button type="button" class="btn ghost wide" data-back-mobile>بازگشت</button>
        </section>

        <!-- Step 3: password and/or OTP -->
        <section class="login-step" data-step="auth" hidden aria-labelledby="login-auth-title">
          <div class="login-auth-head">
            <h2 id="login-auth-title" class="login-step-title" data-auth-role-label>ورود</h2>
            <p class="hint" data-auth-mobile></p>
          </div>

          <div class="login-auth-panels" data-auth-panels>
            <form class="form-grid login-auth-panel is-active" data-otp-form hidden>
              <label>کد پیامک
                <input
                  name="otp"
                  type="text"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  maxlength="6"
                  minlength="4"
                  pattern="[0-9]{4,6}"
                  placeholder="------"
                  required
                />
              </label>
              <div class="inline-actions login-otp-actions">
                <button class="btn wide login-primary-btn" type="submit">تأیید و ورود</button>
                <button type="button" class="btn ghost" data-resend-otp>ارسال مجدد کد</button>
              </div>
              <p class="hint login-dev-hint" data-otp-dev-hint hidden>
                حالت توسعه: بدون پیامک واقعی، کد <strong dir="ltr">123456</strong> را وارد کنید.
              </p>
            </form>

            <form class="form-grid login-auth-panel" data-password-form hidden>
              <label>رمز عبور
                <input
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  minlength="8"
                  required
                />
              </label>
              <button class="btn wide login-primary-btn" type="submit">ورود</button>
            </form>
          </div>

          <div class="login-method-switch" data-method-switch hidden>
            <button type="button" class="login-method-link" data-switch-method></button>
          </div>

          <button type="button" class="btn ghost wide" data-back-from-auth>بازگشت</button>
        </section>
      </div>

      <section data-logged hidden>
        <p>شما وارد شده‌اید: <strong data-name></strong></p>
        <p>نقش: <strong data-role></strong></p>
        <p class="hint">موبایل: <span data-mobile></span></p>
        <div data-bell-root style="margin:0.75rem 0"></div>
        <div class="inline-actions">
          <a class="btn" data-go href="/">ورود به پنل</a>
          <button type="button" class="btn ghost" data-logout>خروج</button>
        </div>
      </section>

      <div class="status-msg" data-status hidden></div>

      <p class="login-footer-link">
        <a href="/">صفحه اصلی</a>
      </p>
    </div>
  </div>
  <script type="module" src="/assets/js/panels/login.js"></script>
</body>
</html>
