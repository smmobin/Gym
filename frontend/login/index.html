<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){try{var t=localStorage.getItem('gym-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute('data-theme','dark');document.documentElement.style.colorScheme='dark';}})();</script>
  <title>ورود به سامانه — GYM CONTROL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body class="panel-page">
  <div class="api-banner" data-api-banner hidden></div>
  <div class="login-shell">
    <div class="login-theme-bar" data-theme-mount></div>
    <div class="login-card">
      <p class="eyebrow en">GYM CONTROL</p>
      <h1>ورود به سامانه</h1>
      <p class="lead">فقط موبایل و رمز را وارد کنید. نقش (مدیر، منشی، مربی یا ورزشکار) را سرور تشخیص می‌دهد.</p>

      <form class="form-grid" data-login-form>
        <label>موبایل<input name="mobile" type="tel" inputmode="numeric" autocomplete="username" placeholder="09xxxxxxxxx" maxlength="11" minlength="11" pattern="09[0-9]{9}" title="موبایل ۱۱ رقمی با ۰۹" required /></label>
        <label>رمز عبور<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button class="btn wide" type="submit">ورود</button>
      </form>

      <section data-logged hidden>
        <p>شما وارد شده‌اید: <strong data-name></strong></p>
        <p>نقش: <strong data-role></strong></p>
        <p class="hint">موبایل: <span data-mobile></span></p>
        <div data-bell-root style="margin:0.75rem 0"></div>
        <div class="inline-actions">
          <a class="btn" data-go href="/">ورود به پنل</a>
          <button type="button" class="btn ghost" data-logout>خروج</button>
        </div>
      </section>

      <div class="status-msg" data-status hidden></div>

      <p class="hint" style="margin-top:1rem">
        <a href="/">صفحه اصلی</a>
      </p>
    </div>
  </div>
  <script type="module" src="/assets/js/panels/login.js"></script>
</body>
</html>
