<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل مدیر — GYM CONTROL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body class="panel-page">
  <div class="api-banner" data-api-banner hidden></div>
  <input type="checkbox" id="side-toggle" class="side-toggle" />
  <div class="app">
    <label for="side-toggle" class="side-backdrop" aria-hidden="true"></label>
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <div><strong>GYM CONTROL</strong><small>پنل مدیر</small></div>
      </a>
      <nav class="nav">
        <p class="nav-label">مدیریت</p>
        <a class="nav-item active" href="#dash">داشبورد</a>
        <a class="nav-item" href="#finance">گزارش مالی</a>
        <a class="nav-item" href="#settings">تنظیمات</a>
        <a class="nav-item" href="#staff">کارکنان</a>
        <a class="nav-item" href="#plans">طرح‌ها</a>
        <a class="nav-item" href="#members">اعضا</a>
        <a class="nav-item" href="#checkin">حضور</a>
        <a class="nav-item" href="#billing">مالی عملیات</a>
        <a class="nav-item" href="#classes">کلاس‌ها</a>
        <a class="nav-item" href="#lockers">کمدها</a>
        <a class="nav-item" href="#trainers">مربیان</a>
        <a class="nav-item" href="#workouts">برنامه‌ها</a>
        <a class="nav-item" href="#guests">مهمان</a>
        <a class="nav-item" href="#trial">صف آزمایشی</a>
        <a class="nav-item" href="#sms">پیامک</a>
      </nav>
      <div class="sidebar-foot">
        <a href="/">صفحه اصلی</a>
        <button type="button" class="btn ghost small" data-logout>خروج</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <label for="side-toggle" class="side-burger" aria-label="منوی پنل">
            <span></span><span></span><span></span>
          </label>
          <div>
            <h1>داشبورد مدیریت</h1>
            <p>خلاصه ماه جاری · داده زنده از API</p>
          </div>
        </div>
        <div class="topbar-actions">
          <time class="topbar-today" data-today-date></time>
          <div data-bell-root></div>
          <div class="user-chip"><span class="avatar" data-avatar>—</span><span data-user-name></span></div>
        </div>
      </header>

      <section class="content">
        <div data-section="dash" data-title="داشبورد مدیریت">
          <div id="mount-dashboard"></div>
        </div>
        <div data-section="finance" data-title="گزارش مالی" hidden><div id="mount-reports"></div></div>
        <div data-section="settings" data-title="تنظیمات باشگاه" hidden><div id="mount-settings"></div></div>
        <div data-section="staff" data-title="کارکنان" hidden><div id="mount-staff"></div></div>
        <div data-section="plans" data-title="طرح‌های عضویت" hidden><div id="mount-plans"></div></div>
        <div data-section="members" data-title="اعضا" hidden><div id="mount-members"></div></div>
        <div data-section="checkin" data-title="حضور" hidden><div id="mount-attendance"></div></div>
        <div data-section="billing" data-title="مالی عملیات" hidden><div id="mount-billing"></div></div>
        <div data-section="classes" data-title="کلاس‌ها" hidden><div id="mount-classes"></div></div>
        <div data-section="lockers" data-title="کمدها" hidden><div id="mount-lockers"></div></div>
        <div data-section="trainers" data-title="مربیان" hidden><div id="mount-trainers"></div></div>
        <div data-section="workouts" data-title="برنامه‌ها" hidden><div id="mount-workouts"></div></div>
        <div data-section="guests" data-title="مهمان" hidden><div id="mount-guests"></div></div>
        <div data-section="trial" data-title="صف آزمایشی" hidden><div id="mount-trial"></div></div>
        <div data-section="sms" data-title="پیامک" hidden><div id="mount-sms"></div></div>
      </section>
    </div>
  </div>
  <script type="module" src="/assets/js/panels/manager.js"></script>
  <script src="/js/custom-select.js"></script>
  <script src="/js/time-picker.js"></script>
  <script src="/js/date-picker.js"></script>
</body>
</html>
